# Questions first, then the settings that start with `_`.
# The repo exists on GitHub first, with its README, LICENSE and .gitignore, then `uv init` writes pyproject.toml, .python-version and src/, and the template adds to both.
# `language` picks the directory Copier renders; `shared/` holds the files every language includes.
# A workflow wraps each GitHub `${{ }}` expression in `{% raw %}`, so Jinja leaves it alone; `{% endraw +%}` keeps the line break that `trim_blocks` would drop.

repo:
  type: str
  help: The GitHub repository name, which is also the PyPI name
  default: "{{ _copier_conf.dst_path.name }}"

owner:
  type: str
  help: The GitHub owner
  default: ozanozbeker

language:
  type: str
  help: The language, which picks the template directory
  choices:
    Python: python
    None, a repo of prose and config: none
  default: python

package:
  type: str
  help: The import name under src/, as `uv init` named it
  default: "{{ repo | replace('-', '_') }}"
  when: "{{ language == 'python' }}"

python_floor:
  type: str
  help: The oldest CPython the repo supports, the same as `uv init --python`
  choices: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
  default: "3.14"
  when: "{{ language == 'python' }}"

pypi:
  type: bool
  help: Is it published to PyPI?
  default: false
  when: "{{ language == 'python' }}"

docs:
  type: bool
  help: Does it have a docs site on GitHub Pages?
  # A skipped question takes its default, so the default itself must be false off PyPI.
  default: "{% if pypi %}true{% else %}false{% endif %}"
  when: "{{ pypi }}"

framework:
  type: str
  help: The framework, which adds its ruff and pytest settings
  choices:
    none: ""
    Dagster: dagster
    FastAPI: fastapi
  default: ""
  when: "{{ language == 'python' }}"

apply:
  type: bool
  help: Run the tasks that append to .gitignore and edit pyproject.toml? They need `--trust`
  default: true

# --- Computed, never asked ---

# Every CPython with a final release, oldest first. Add a version at its final release, and remove one in the first release after its end of life.
python_released:
  type: yaml
  default: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
  when: false

# The newest CPython that has reached its first beta. It stays on a version after its final release, until the next version reaches its first beta.
python_next:
  type: str
  default: "3.15"
  when: false

# The floor and every release above it: the classifiers and the CI matrix.
python_versions:
  type: yaml
  default: "{% set ns = namespace(on=false, out=[]) %}{% for v in python_released %}{% if v == python_floor %}{% set ns.on = true %}{% endif %}{% if ns.on %}{% set ns.out = ns.out + [v] %}{% endif %}{% endfor %}{{ ns.out | to_json }}"
  when: false

# --- Settings ---

_min_copier_version: "9.19.0"
_subdirectory: "{{ language }}"
_envops:
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true
_exclude:
  - copier.yml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
# Tasks run after the files are written, on copy and on update, so each one is idempotent.
# Copier refuses a template with tasks unless `--trust` is passed, and `--skip-tasks` skips them all.
_tasks:
  # `_copier_python` is the interpreter running Copier, so the script needs no shell and no project.
  - command:
      - "{{ _copier_python }}"
      - "{{ _copier_conf.src_path }}/scripts/gitignore.py"
      - ".rumdl_cache/"
      - "{% if docs %}great-docs/{% endif %}"
      - "{% if docs %}_great_docs_build/{% endif %}"
      - "{% if docs %}_freeze/{% endif %}"
    when: "{{ apply }}"
  # One script for pyproject.toml, which returns at once where the file is absent: `copier update` runs the
  # tasks in the empty reference renders it diffs, as well as in the repo. `--no-project` keeps tomlkit out of the repo's own environment.
  - command:
      - uv
      - run
      - --no-project
      - --with
      - tomlkit
      - "{{ _copier_conf.src_path }}/scripts/pyproject.py"
      - --owner
      - "{{ owner }}"
      - --repo
      - "{{ repo }}"
      - --versions
      - "{{ python_versions | join(',') }}"
      - --docs
      - "{{ docs }}"
      - --dev
      - coverage
      - prek
      - pytest
      - ruff
      - ty
      - "{% if framework == 'dagster' %}dagster-dg-cli{% endif %}"
      - "{% if framework == 'dagster' %}dagster-webserver{% endif %}"
      - "{% if framework == 'fastapi' %}httpx{% endif %}"
    when: "{{ apply and language == 'python' }}"

_message_after_copy: |
  {% if not apply %}
  Append to .gitignore:
    .rumdl_cache/
  {% if docs %}
    great-docs/
    _great_docs_build/
    _freeze/
  {% endif %}
  {% if language == 'python' %}
  Add the tools:
    uv add --raw --group dev coverage prek pytest ruff ty{% if framework == 'dagster' %} dagster-dg-cli dagster-webserver{% elif framework == 'fastapi' %} httpx{% endif +%}
  {% if docs %}
    uv add --group docs 'great-docs>=0.17'
  {% endif %}
  Add to [project] in pyproject.toml, with the same versions as the test matrix in ci.yml:
    classifiers = [
      "Programming Language :: Python :: 3",
  {% for v in python_versions %}
      "Programming Language :: Python :: {{ v }}",
  {% endfor %}
      "Typing :: Typed",
    ]
    [project.urls]
    Changelog = "https://github.com/{{ owner }}/{{ repo }}/releases"
  {% if docs %}
    Documentation = "https://{{ owner }}.github.io/{{ repo }}/"
  {% endif %}
    Homepage = "https://github.com/{{ owner }}/{{ repo }}"
    Issues = "https://github.com/{{ owner }}/{{ repo }}/issues"
    Source = "https://github.com/{{ owner }}/{{ repo }}"
  {% endif %}
  {% endif %}
  {% if language == 'python' %}
  Replace the hello() stub uv init wrote, and write a first test in tests/, because pytest exits 5 with none.
  Then:
    uv sync && uv run prek install && uv run prek run --all-files
  {% else %}
  Then:
    prek install && prek run --all-files
  {% endif %}
  Then apply the repository settings: the github-style skill's settings.md.
