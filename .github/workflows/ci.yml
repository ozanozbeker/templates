name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A fresh run on the current `main` with no new commit.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The same versions as the Python classifiers in `pyproject.toml`.
        python: ["3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # uv otherwise runs the macOS and Windows images' own patch release, which can predate a security fix.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          # uv follows setup-uv, which Dependabot bumps after the cooldown.
          version: latest-known
          # Every dependency is a pre-built wheel, so a cache hit saves nothing.
          enable-cache: false
      # `--no-editable` installs the built wheel, so the tests import what PyPI would get.
      - run: uv sync --locked --no-editable
      - run: uv run --no-sync pytest

  # The newest CPython that has reached its first beta, in a job that may fail.
  # It stays on a version after its final release, until the next version reaches its first beta.
  next-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          version: latest-known
          enable-cache: false
      - run: uv sync --locked --no-editable
      - run: uv run --no-sync pytest

  # Local hooks miss a `--no-verify` commit and a fork's commits, so CI runs the hooks on every file and `gitleaks-ci` on every new commit.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `gitleaks-ci` reads every commit the pull request adds.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --no-sync prek run --all-files --show-diff-on-failure
        env:
          # zizmor skips its online audits without a token.
          GH_TOKEN: ${{ github.token }}
          # Both read staged changes only, and CI stages nothing.
          SKIP: gitleaks,check-added-large-files
      # gitleaks exits 0 when `git log` fails on a shallow clone, so check that the parent exists first.
      - run: |
          git rev-parse --verify --quiet HEAD^1
          uv run --no-sync prek run --all-files --hook-stage manual gitleaks-ci

  # Fails a pull request that adds a dependency with a known vulnerability or a disallowed license. The diff needs a base, so the job runs on pull requests only.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  # The ruleset requires this one job, so a change to the jobs above never touches the ruleset.
  all-green:
    if: always()
    needs: [test, next-python, lint, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-failures: next-python
          # `dependency-review` has no diff on a push to `main`.
          allowed-skips: dependency-review
          jobs: ${{ toJSON(needs) }}
