default_language_version.python = "<python>"

# --- Local Tools ---
# `uv run` pins each tool to the version in `uv.lock`, the same one the editor runs.
[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-check",
    name = "ruff check",
    entry = "uv run ruff check --fix --force-exclude",
    language = "system",
    types_or = ["python", "pyi", "jupyter"],
    require_serial = true,
  },
  {
    id = "ruff-format",
    name = "ruff format",
    entry = "uv run ruff format --force-exclude",
    language = "system",
    # prek tags a `.qmd` page `quarto`, not `markdown`.
    types_or = ["python", "pyi", "jupyter", "markdown", "quarto"],
    require_serial = true,
  },
  {
    id = "uv-lock",
    name = "uv lock --check",
    entry = "uv lock --check",
    language = "system",
    files = '^(.*/)?(pyproject\.toml|uv\.lock)$',
    pass_filenames = false,
  },
  {
    id = "ty",
    name = "ty",
    entry = "uv run ty check",
    language = "system",
    types = ["python"],
    pass_filenames = false,
  },
]
